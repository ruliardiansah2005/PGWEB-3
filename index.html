<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Color</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #color_area {
            height: 400px;
            background-color: #f6ff00;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row mt-2" align="justify-content-center">
            <div class="col d-grid">
                <button type="button" class="btn"
                    style="background-color: rgb(255, 181, 230); color: white; font-weight: bold; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);"
                    onclick="ubahWarna('rgb(255, 181, 230)')">merah</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn"
                    style="background-color: rgb(195, 255, 0); color: white; font-weight: bold; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);"
                    onclick="ubahWarna('rgb(195, 255, 0)')">hijau</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn"
                    style="background-color: rgb(0, 102, 255); color: white; font-weight: bold; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);"
                    onclick="ubahWarna('rgb(0, 102, 255)')">biru</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn"
                    style="background-color: rgb(255, 255, 0); color: white; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5); font-weight: bold;"
                    onclick="ubahWarna('rgb(255, 255, 0)')">kuning</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn"
                    style="background-color: rgb(0, 255, 229); color: white; font-weight: bold; text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);"
                    onclick="ubahWarna('rgb(0, 255, 229)')">biru muda</button>
            </div>
            <div class="alert alert-light; text-center mt-5" role="alert">
                Ruli Ardiansah | 25/567617/SV/27206 | PGWEB Acara 3
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script>
        // //function cahange color
        // function merah() {
        //     document.getElementById("color_area").style.backgroundColor = "red";
        // }
        // function hijau() {
        //     document.getElementById("color_area").style.backgroundColor = "green";
        // }
        // function biru() {
        //     document.getElementById("color_area").style.backgroundColor = "blue";
        // }
        // function reset() {
        //     document.getElementById("color_area").style.backgroundColor = "yellow";
        // }

        //function ubah warna
        function ubahWarna(warna) {
            document.getElementById("color_area").style.backgroundColor = warna;
        }


    </script>
</body>

</html>
